name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate data
        run: pnpm data
      - name: Verify data and code
        run: |
          pnpm test
          pnpm lint
      - name: Build
        run: pnpm build
        env:
          # where reviewers' notes are emailed; set as a repository variable, empty hides the option
          VITE_REVIEW_EMAIL: ${{ vars.REVIEW_EMAIL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # the site is some fifteen thousand files; when GitHub is slow, syncing them can take
          # longer than the action's default ten minutes, after which it cancels the deployment
          timeout: 1200000
