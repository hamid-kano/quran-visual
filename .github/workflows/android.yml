name: Android app

# Builds the Android app from the same code as the website, and keeps the result as a download
# of the run (Actions → this run → Artifacts). A debug build, to install and try on a phone;
# the signed build for Google Play comes once the release key is set as repository secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # to publish the APK on the repository's releases page
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate data
        run: pnpm data
      - name: Verify data and code
        run: |
          pnpm test
          pnpm lint
      - name: Build the app's copy of the site
        run: pnpm build:app
        env:
          VITE_REVIEW_EMAIL: ${{ vars.REVIEW_EMAIL }}
      - name: Copy it into the Android project
        run: npx cap sync android
      # Capacitor 8 builds with JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ayat-maria-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      # a direct download, the same address every time: the latest build replaces the file
      - name: Publish the APK for direct download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ayat-maria.apk
          notes="نسخة تجريبية من تطبيق «آيات مرئية» لأندرويد، تُبنى تلقائياً مع كل تحديث للمنصة.
          آخر بناء: ${GITHUB_SHA::7} (رقم ${{ github.run_number }}).
          للتثبيت: حمّل ayat-maria.apk وافتحه على الهاتف، واسمح بالتثبيت من هذا المصدر."
          if gh release view app-latest >/dev/null 2>&1; then
            gh release edit app-latest --notes "$notes"
          else
            gh release create app-latest --prerelease --target "$GITHUB_SHA" \
              --title "آيات مرئية لأندرويد (نسخة تجريبية)" --notes "$notes"
          fi
          gh release upload app-latest ayat-maria.apk --clobber
